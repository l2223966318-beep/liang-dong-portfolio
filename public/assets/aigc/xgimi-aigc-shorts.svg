<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AIGC Commercial Shorts</title>
  <desc id="desc">Four AI short-film experiments and one audio work by Liang Dong.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0e11"/>
      <stop offset=".5" stop-color="#123ecf"/>
      <stop offset="1" stop-color="#ef2b22"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity=".55"/>
  <g fill="none" stroke="#fff" stroke-opacity=".28">
    <path d="M90 118H1510M90 782H1510"/>
    <path d="M90 118V782M1510 118V782"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#fff">
    <text x="105" y="175" font-size="28" font-weight="700" letter-spacing="7">AI.07 / AIGC COMMERCIAL SHORTS</text>
    <text x="105" y="390" font-size="132" font-weight="900" letter-spacing="-8">AI 短视频</text>
    <text x="105" y="520" font-size="132" font-weight="900" letter-spacing="-8">创意实验</text>
    <text x="108" y="620" font-size="34" font-weight="500">4 FILMS  ·  1 AUDIO  ·  CONCEPT / STORY / VISUAL / EDIT</text>
    <text x="108" y="742" font-size="24" font-weight="700" letter-spacing="3">XGIMI CREATIVE PRACTICE — 2026</text>
  </g>
  <g transform="translate(1175 235)">
    <rect width="210" height="370" rx="30" fill="#f3d900"/>
    <circle cx="105" cy="104" r="56" fill="#0d0e11"/>
    <path d="M87 79l56 25-56 25z" fill="#fff"/>
    <text x="105" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900" fill="#0d0e11">04</text>
    <text x="105" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0d0e11">SHORT FILMS</text>
    <text x="105" y="328" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900" fill="#0d0e11">+ 01 AUDIO</text>
  </g>
</svg>